{{- if and .Values.migrations.enabled .Values.app.secrets (not .Values.app.existingSecret) }}
# Copy of secret.yaml for the migration Job. That Job is a pre-install hook, so
# it runs before the release's own Secret exists; this copy is a hook created
# just ahead of it (lower weight) and deleted once the hooks succeed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openprime-app-backend.fullname" . }}-migrate-secrets
  labels:
    {{- include "openprime-app-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- range $key, $value := .Values.app.secrets }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
