# Default values for openprime-app-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

# Pod Disruption Budget - keeps at least one replica available during voluntary
# disruptions (node drains, cluster upgrades). Safe because this service runs
# >=2 replicas. To protect a single stateful replica instead, set
# maxUnavailable: 0 (blocks voluntary eviction; requires manual node drains).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Graceful shutdown - a preStop delay lets the load balancer deregister this
# pod's endpoint before SIGTERM, avoiding 5xx during rollouts/scale-down.
# terminationGracePeriodSeconds bounds the total shutdown window. Generate/push
# run as async DB-backed jobs processed by the dedicated worker Deployment (see
# the worker section below): on SIGTERM the worker drains in-flight jobs and
# requeues the rest, so a long git push no longer blocks a rollout.
terminationGracePeriodSeconds: 45
gracefulShutdown:
  enabled: true
  preStopSleepSeconds: 15

image:
  repository: ghcr.io/devopsgroupeu/openprime-app-backend
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Deployment strategy
strategy:
  type: RollingUpdate

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.openprime.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: openprime-api-tls
  #    hosts:
  #      - api.openprime.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - openprime-app-backend
          topologyKey: kubernetes.io/hostname

# Application specific configuration
app:
  # Environment variables for the Node.js app
  env:
    # Application configuration
    NODE_ENV: "production"
    PORT: "3001"
    LOG_LEVEL: "info"

    # Database configuration
    DB_HOST: "openprime-postgres"
    DB_PORT: "5432"
    DB_NAME: "openprime"
    DB_USER: "openprime_user"

    # External service URLs
    FRONTEND_URL: "http://openprime-app"
    KEYCLOAK_URL: "http://openprime-keycloak:8080"
    KEYCLOAK_REALM: "openprime"
    KEYCLOAK_CLIENT_ID: "openprime-app"
    INJECTO_SERVICE_URL: "http://injecto:8000"

    # AWS Configuration (if needed)
    AWS_REGION: "us-east-1"

    # Infrastructure templates repository configuration
    INFRA_TEMPLATES_REPO_URL: "https://github.com/devopsgroupeu/openprime-infra-templates.git"
    INFRA_TEMPLATES_BRANCH: "main"

    # Async job worker (generate/push) — DB-backed queue. The worker runs in a
    # dedicated single-instance Deployment (see the worker section below), so
    # the API pods must NOT run an in-process worker (WORKER_ENABLED=false).
    # Concurrency caps protect Injecto/StateCraft/Bedrock from saturation.
    WORKER_ENABLED: "false"
    JOB_POLL_INTERVAL_MS: "3000"
    MAX_CONCURRENT_JOBS: "2"
    MAX_CONCURRENT_GENERATE: "2"
    MAX_CONCURRENT_PUSH: "1"
    JOB_MAX_ATTEMPTS: "3"
    JOB_DEADLINE_MS: "600000"
    JOB_RETENTION_DAYS: "30"
    JOB_DRAIN_TIMEOUT_MS: "30000"
    UPLOADS_DIR: "/app/uploads"

  # Secrets (should be provided via external secret management)
  # Use existing secret instead of creating one from values
  existingSecret: ""
  # Keys to load from existing secret (only used when existingSecret is set)
  existingSecretKeys:
    - DB_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - BEDROCK_INFERENCE_PROFILE_ARN
    - CREDENTIALS_ENCRYPTION_KEY
  # Secrets to create (only used when existingSecret is not set)
  secrets:
    # Database password
    DB_PASSWORD: "openprime123"
    # AWS credentials for Bedrock AI integration
    AWS_ACCESS_KEY_ID: "secret"
    AWS_SECRET_ACCESS_KEY: "secret"
    BEDROCK_INFERENCE_PROFILE_ARN: "secret"

# Dedicated single-instance job worker (generate/push). Runs as its own
# Deployment (worker-deployment.yaml) with replicas: 1 so a rolling restart of
# the API pods never requeues running jobs (which caused duplicate git pushes
# into customer repos). Generated ZIPs are stored on the jobs row (artifact
# BYTEA column), so the uploads PVC stays ReadWriteOnce — no shared filesystem
# is needed. The worker receives the full app.env (JOB_*/MAX_CONCURRENT_*/
# UPLOADS_DIR and secrets) plus the worker.env overrides below.
worker:
  enabled: true
  replicaCount: 1
  # Worker-specific env overrides, merged on top of app.env (later entries win
  # in Kubernetes). The worker entrypoint (src/worker.js) calls startWorker()
  # unconditionally — it does not read WORKER_ENABLED. That flag only gates the
  # in-process worker in src/server.js, which the API pods use with "false".
  env: {}
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Database migrations (umzug) run as a Helm pre-install/pre-upgrade hook Job, so
# the schema is applied before the app rolls out. The app refuses to start in
# production while migrations are pending (validate-not-mutate), so this must be
# enabled wherever the app runs against a managed/persistent database.
migrations:
  enabled: false
  # Command executed inside the backend image.
  command:
    - node
    - src/scripts/migrate.js
    - up
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Persistent volumes
persistence:
  enabled: true
  # Storage for uploads. ReadWriteOnce: generated ZIPs are stored in the DB
  # (jobs.artifact), not on this volume, so it does not need to be shared.
  uploads:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /app/uploads
  # Storage for logs
  logs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 2Gi
    mountPath: /app/logs

# Health check configuration
healthCheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Network policies
networkPolicy:
  enabled: false
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: injecto
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-postgres
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-keycloak