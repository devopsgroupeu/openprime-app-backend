name: Publish (Dev)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml

  scan:
    name: Image scan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-image-scan.yml

  publish-docker:
    needs: [test, scan]
    permissions:
      contents: read
      packages: write
      id-token: write # caps the reusable workflow's permissions; needed for keyless cosign
    uses: ./.github/workflows/reusable-docker-publish.yml
    with:
      tags: |
        type=ref,event=branch
        type=sha,prefix=dev-

  publish-helm:
    needs: [test, publish-docker]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-helm-publish.yml
    with:
      image-tag: ${{ needs.publish-docker.outputs.image-version }}
      package-name: openprime-app-backend
